name: Update Niš air quality data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update JSON feeds
        run: node scripts/update-data.js

      - name: Commit changed feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/nis-7d.json data/nis-30d.json; then
            echo "No data changes."
          else
            git add data/nis-7d.json data/nis-30d.json
            git commit -m "Update Niš air quality data"
            git push
          fi
